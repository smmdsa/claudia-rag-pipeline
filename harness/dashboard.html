<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board</title>
<style>
  :root { color-scheme: light dark;
    --bg:#f6f7f9; --card:#fff; --ink:#151a22; --ink2:#5a6472; --line:#d9dee6;
    --todo:#8a93a1; --prog:#b7791f; --done:#2e7d5b; --warn:#b3413a; --eye:#1e5fa8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1318; --card:#161b22; --ink:#e6eaef; --ink2:#a3aebb; --line:#2a333e;
    --todo:#7a8593; --prog:#d9a441; --done:#4fa582; --warn:#e07068; --eye:#4f92db; } }
  body { margin:0; padding:1.5rem; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
  h1 { font-size:1.3rem; margin:0 0 .25rem; } h2 { font-size:1.05rem; margin:1.5rem 0 .5rem; }
  .meta { color:var(--ink2); font-size:.85rem; }
  .row { display:flex; gap:1rem; flex-wrap:wrap; margin:.75rem 0; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.6rem .9rem; min-width:9rem; }
  .tile b { display:block; font-size:1.4rem; } .tile span { color:var(--ink2); font-size:.8rem; }
  .cols { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:.75rem; }
  .col { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.5rem; min-height:4rem; }
  .col h4 { margin:0 0 .4rem; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink2); }
  .card { border:1px solid var(--line); border-left:4px solid var(--todo); border-radius:6px; padding:.4rem .6rem; margin:.35rem 0; background:var(--bg); cursor:pointer; }
  .card:hover { border-color:var(--ink2); } .card:focus-visible { outline:2px solid var(--eye); outline-offset:1px; }
  .card.in-progress { border-left-color:var(--prog); } .card.done { border-left-color:var(--done); }
  .card .id { font-family: ui-monospace, monospace; font-size:.8rem; color:var(--ink2); }
  .chip { display:inline-block; font-size:.72rem; padding:0 .4rem; border-radius:999px; border:1px solid var(--line); margin-right:.25rem; }
  .chip.eye { border-color:var(--eye); color:var(--eye); } .chip.warn { border-color:var(--warn); color:var(--warn); }
  .chip.user { border-color:var(--prog); color:var(--prog); }
  table { border-collapse:collapse; width:100%; } td, th { text-align:left; padding:.3rem .5rem; border-bottom:1px solid var(--line); }
  .over { color:var(--warn); font-weight:600; }
  .epic { margin:.75rem 0 0; font-weight:600; }
  @media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }
  /* The modal. `hidden` must win over `display:flex`, so the attribute rule comes second. */
  .modal { position:fixed; inset:0; z-index:10; overflow:auto; padding:2rem 1rem;
           background:rgba(0,0,0,.45); display:flex; align-items:flex-start; justify-content:center; }
  .modal[hidden] { display:none; }
  .sheet { position:relative; width:100%; max-width:52rem; padding:1.2rem 1.6rem 1.6rem;
           background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .sheet .x { position:absolute; top:.4rem; right:.6rem; padding:.2rem .4rem; line-height:1;
              font-size:1.4rem; color:var(--ink2); background:none; border:0; cursor:pointer; }
  .sheet h2 { margin:0 0 .2rem; } .sheet h3 { margin:1.1rem 0 .3rem; font-size:1rem; }
  .sheet h4 { margin:.8rem 0 .3rem; font-size:.9rem; } .sheet p { margin:.4rem 0; }
  .sheet pre { padding:.5rem .7rem; overflow-x:auto; font-size:.82rem; background:var(--bg);
               border:1px solid var(--line); border-radius:6px; }
  .sheet code { padding:0 .2rem; font-family:ui-monospace, monospace; font-size:.86em; background:var(--bg); border-radius:3px; }
  .sheet blockquote { margin:.5rem 0; padding:.1rem .8rem; border-left:3px solid var(--line); color:var(--ink2); }
  .sheet ul, .sheet ol { margin:.3rem 0; padding-left:1.2rem; }
  .notes li { margin:.35rem 0; }
  .notes .when { font-family:ui-monospace, monospace; font-size:.78rem; color:var(--ink2); }
</style>
</head>
<body>
<h1>Board</h1>
<p class="meta" id="meta"></p>
<div class="row" id="tiles"></div>
<h2>Human verdict queue</h2>
<div id="queue"></div>
<div id="sprints"></div>
<h2>Backlog</h2>
<div id="backlog"></div>
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="x" id="modal-close" aria-label="close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>
<script id="data" type="application/json">__BOARD_JSON__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tasks = D.tasks, byState = s => tasks.filter(t => t.state === s);
  const notesOf = id => (D.notes || []).filter(n => n.task === id);
  const queue = tasks.filter(t => t.state === 'in-progress' && t.eye !== 'NONE');
  const overdue = D.sprints.filter(s => s.status === 'ended' && tasks.some(t => t.sprint === s.id && t.state !== 'done'));
  document.getElementById('meta').textContent =
    'Cache built ' + (D.meta.built_at || '?') + ' · today ' + D.today + ' · harness ' + (D.meta.harness_version || '?') +
    ' · the folder tree under work/ is the truth; this page is a copy.';
  const tile = (n, label, cls) => `<div class="tile"><b class="${cls||''}">${esc(n)}</b><span>${esc(label)}</span></div>`;
  document.getElementById('tiles').innerHTML =
    tile(byState('todo').length, 'todo') + tile(byState('in-progress').length, 'in progress') + tile(byState('done').length, 'done') +
    tile(queue.length, 'await a human verdict', queue.length ? 'over' : '') +
    tile(tasks.filter(t => t.owner === 'user' && t.state !== 'done').length, 'only the user can do') +
    tile(overdue.length, 'overdue sprints', overdue.length ? 'over' : '');
  const chips = t => `<span class="chip">work ${esc(t.work)}</span>` +
    `<span class="chip ${t.eye !== 'NONE' ? 'eye' : ''}">eye ${esc(t.eye)}</span>` +
    (t.owner === 'user' ? '<span class="chip user">user</span>' : '') +
    (t.due ? `<span class="chip warn">due ${esc(t.due)}</span>` : '') +
    (t.priority === 1 ? '<span class="chip">priority 1</span>' : '') +
    (t.needs_decision ? `<span class="chip warn">waits ${esc(t.needs_decision)}</span>` : '') +
    (t.state === 'done' && t.eye !== 'NONE' && !t.has_verdict ? '<span class="chip warn">NO VERDICT</span>' : '') +
    (notesOf(t.id).length ? `<span class="chip">${notesOf(t.id).length} note${notesOf(t.id).length === 1 ? '' : 's'}</span>` : '');
  const card = t => `<div class="card ${t.state}" data-id="${esc(t.id)}" tabindex="0" role="button">` +
    `<span class="id">${esc(t.id)}</span> ${esc(t.title)}<br>${chips(t)}</div>`;
  const age = t => t.state_age_days == null ? 'not measured (move not committed)' : t.state_age_days + ' d';
  document.getElementById('queue').innerHTML = queue.length
    ? '<table><tr><th>id</th><th>title</th><th>eye</th><th>waiting</th><th>epic</th></tr>' +
      queue.map(t => `<tr><td>${esc(t.id)}</td><td>${esc(t.title)}</td><td>${esc(t.eye)}</td><td>${esc(age(t))}</td><td>${esc(t.epic)}</td></tr>`).join('') + '</table>'
    : '<p class="meta">empty. Nothing built waits for a person.</p>';
  const cols = list => `<div class="cols">` + ['todo','in-progress','done'].map(s =>
    `<div class="col"><h4>${s} (${list.filter(t => t.state === s).length})</h4>${list.filter(t => t.state === s).map(card).join('')}</div>`).join('') + `</div>`;
  document.getElementById('sprints').innerHTML = D.sprints.map(s => {
    const st = tasks.filter(t => t.sprint === s.id);
    const when = s.days_remaining == null ? 'no dates' : (s.days_remaining >= 0 ? s.days_remaining + ' d remain' : 'ended ' + (-s.days_remaining) + ' d ago');
    const over = s.status === 'ended' && st.some(t => t.state !== 'done');
    return `<h2>${esc(s.id)} — ${esc(s.title)} <span class="meta">[${esc(s.status)} · ${esc(when)}]</span>` +
      (over ? ' <span class="over">OVERDUE — the date does not move</span>' : '') + `</h2>` +
      D.epics.filter(e => e.sprint === s.id).map(e => {
        const et = st.filter(t => t.epic === e.id);
        return `<p class="epic">${esc(e.id)} ${esc(e.title)} <span class="meta">(${et.filter(t => t.state==='done').length}/${et.length})</span></p>` + cols(et);
      }).join('');
  }).join('') || '<p class="meta">no sprint</p>';
  const bl = tasks.filter(t => !t.sprint);
  document.getElementById('backlog').innerHTML = bl.length ? bl.map(card).join('') : '<p class="meta">empty</p>';

  // ---- the modal. The page ships one file and no third-party package, so the
  // markdown renderer lives here. It escapes first, then it marks up the escaped text.
  const inline = s => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  const md = src => {
    const out = []; let mode = '', fence = false, buf = [];
    const close = () => {
      if (mode === 'ul' || mode === 'ol') out.push('</' + mode + '>');
      else if (mode === 'q') out.push('</blockquote>');
      else if (mode === 'p') out.push('</p>');
      mode = '';
    };
    for (const raw of esc(src).split('\n')) {
      const line = raw.replace(/\s+$/, '');
      if (/^```/.test(line)) {
        if (fence) { out.push('<pre>' + buf.join('\n') + '</pre>'); buf = []; fence = false; } else { close(); fence = true; }
        continue;
      }
      if (fence) { buf.push(line); continue; }
      if (!line.trim()) { close(); continue; }
      let m;
      if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) { close(); const n = Math.min(m[1].length + 2, 6); out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
      const bullet = /^[-*]\s+(.*)$/.exec(line);
      const number = bullet ? null : /^(\d+)\.\s+(.*)$/.exec(line);
      if (bullet || number) {
        // An STR is an ordered procedure. A `<ul>` renders step 5 as step 1, so a
        // numbered list opens an `<ol>`, and a list that starts at n says so.
        const want = bullet ? 'ul' : 'ol';
        if (mode !== want) {
          close();
          const n = number ? parseInt(number[1], 10) : 1;
          out.push(want === 'ol' && n !== 1 ? `<ol start="${n}">` : '<' + want + '>');
          mode = want;
        }
        out.push('<li>' + inline(bullet ? bullet[1] : number[2]) + '</li>'); continue;
      }
      if ((m = /^&gt;\s?(.*)$/.exec(line))) {
        if (mode !== 'q') { close(); out.push('<blockquote>'); mode = 'q'; }
        out.push(inline(m[1]) + '<br>'); continue;
      }
      if (mode === 'ul' || mode === 'ol') {
        // A wrapped step belongs to its own `<li>`. Text between two `<li>` is not
        // valid HTML, and the browser lifts it out of the list.
        const wrap = inline(line.replace(/^\s+/, ''));
        const last = out.length - 1;
        if (out[last].endsWith('</li>')) out[last] = out[last].slice(0, -5) + ' ' + wrap + '</li>';
        else out.push('<li>' + wrap + '</li>');
        continue;
      }
      if (mode === 'q') { out.push(inline(line) + ' '); continue; }
      if (mode !== 'p') { close(); out.push('<p>'); mode = 'p'; }
      out.push(inline(line) + ' ');
    }
    if (fence && buf.length) out.push('<pre>' + buf.join('\n') + '</pre>');
    close();
    return out.join('\n');
  };
  // The modal prints the notes above the file, so the file drops its own H1 and its
  // `## Notes` section. Nobody reads the same lines twice.
  const trim = b => String(b == null ? '' : b)
    .replace(/^\s*#\s+[^\n]*\n/, '')
    .replace(/\n## Notes[^\n]*\n[\s\S]*?(?=\n## |$)/, '');
  const modal = document.getElementById('modal');
  // The card that opened the modal takes the focus back on close. Without this the
  // keyboard user lands on the body, and the next Enter reaches nothing.
  let opener = null;
  const openTask = (id, from) => {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    opener = from || null;
    const ns = notesOf(id);
    document.getElementById('modal-body').innerHTML =
      `<h2 id="modal-title"><span class="id">${esc(t.id)}</span> ${esc(t.title)}</h2>` +
      `<p class="meta">${esc(t.state)} · ${esc(t.sprint || 'backlog')}${t.epic ? ' · ' + esc(t.epic) : ''} · ` +
      `<code>${esc(t.path)}</code> · the file is the truth; this modal is a copy.</p>` +
      `<p>${chips(t)}</p>` +
      `<h3>Notes (${ns.length})</h3>` +
      (ns.length
        ? '<ul class="notes">' + ns.map(n =>
            `<li><span class="when">${esc(n.date)} · ${esc(n.author)}</span> ${esc(n.text)}</li>`).join('') + '</ul>'
        : '<p class="meta">no note yet. The agent writes one on every start and on every done.</p>') +
      `<h3>The task file</h3>` + md(trim(t.body));
    modal.hidden = false;
    document.getElementById('modal-close').focus();
  };
  const closeModal = () => {
    modal.hidden = true;
    if (opener) { opener.focus(); opener = null; }
  };
  document.addEventListener('click', ev => {
    if (ev.target.closest && ev.target.closest('.sheet') && ev.target.id !== 'modal-close') return;
    if (ev.target === modal || ev.target.id === 'modal-close') { closeModal(); return; }
    const c = ev.target.closest && ev.target.closest('.card');
    if (c && c.dataset.id) openTask(c.dataset.id, c);
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && !modal.hidden) { closeModal(); return; }
    const c = ev.target.closest && ev.target.closest('.card');
    if (c && c.dataset.id && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openTask(c.dataset.id, c); }
  });
})();
</script>
</body>
</html>
