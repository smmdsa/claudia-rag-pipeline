# Write the contributor list of README.md after every merge to main.
#
# The list holds names and no commit counts, so the block changes only when a new
# person lands a first patch. That costs one commit per contributor, and never one
# commit per push.
#
# A push that GITHUB_TOKEN makes starts no workflow, so this job cannot start itself.
name: contributors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit, per the package policy. This is actions/checkout v4.2.2.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Write the list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/contributors.py

      - name: Commit the change
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "contributors: README.md is current. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "readme: thanks to the contributors"
          git push
